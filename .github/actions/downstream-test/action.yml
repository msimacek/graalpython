name: Run downstream test
description: Shared steps for running a downstream package test against a GraalPy standalone build (latest CE dev build on Mac OS)

inputs:
  package:
    description: Downstream package name as accepted by mx.graalpython/downstream_tests.py
    required: true
  needs_cmake:
    description: Whether to install CMake
    required: false
    default: "false"
  needs_rust:
    description: Whether to install Rust toolchain
    required: false
    default: "false"
  needs_uv:
    description: Whether to install uv
    required: false
    default: "false"
  platform:
    description: Platform identifier (linux/macos)
    required: true
  arch:
    description: Architecture identifier (e.g. amd64/aarch64)
    required: true
  use_ce_dev_build:
    description: Use the latest CE dev build tarball also on Linux (instead of the locally built standalone artifact).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install CMake (Linux)
      if: ${{ inputs.platform == 'linux' && inputs.needs_cmake == 'true' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake

    - name: Install CMake (Darwin)
      if: ${{ inputs.platform == 'macos' && inputs.needs_cmake == 'true' }}
      shell: bash
      run: |
        if brew list cmake >/dev/null 2>&1; then
          echo "cmake already installed"
        else
          brew install cmake
        fi

    - name: Install Rust toolchain
      if: ${{ inputs.needs_rust == 'true' }}
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        echo "${HOME}/.cargo/bin" >> $GITHUB_PATH

    - name: Install uv
      if: ${{ inputs.needs_uv == 'true' }}
      shell: bash
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Checkout main repository
      uses: actions/checkout@v4

    - name: Get GraalPy
      id: graalpy
      uses: ./.github/actions/get-graalpy
      with:
        platform: ${{ inputs.platform }}
        arch: ${{ inputs.arch }}
        use_ce_dev_build: ${{ inputs.use_ce_dev_build }}

    - name: Run downstream tests for ${{ inputs.package }}
      shell: bash
      run: python mx.graalpython/downstream_tests.py "${{ steps.graalpy.outputs.graalpy_home }}/bin/python" ${{ inputs.package }}