name: Build wheel (single package)

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      platform:
        type: string
        required: true
      arch:
        type: string
        required: true
      use_ce_dev_build:
        type: boolean
        required: false
        default: false
      pip_find_links_artifact:
        type: string
        required: false
        default: ""

jobs:
  build-wheel:
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-latest' || 'macos-latest' }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGES_TO_BUILD: ${{ inputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dependency wheels
        if: ${{ inputs.pip_find_links_artifact != '' }}
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.pip_find_links_artifact }}
          path: wheelhouse

      - name: Set PIP_FIND_LINKS for build
        if: ${{ inputs.pip_find_links_artifact != '' }}
        shell: bash
        run: |
          echo "PIP_FIND_LINKS=$GITHUB_WORKSPACE/wheelhouse" >> $GITHUB_ENV

      - name: Get GraalPy
        id: graalpy
        uses: ./.github/actions/get-graalpy
        with:
          platform: ${{ inputs.platform }}
          arch: ${{ inputs.arch }}
          use_ce_dev_build: ${{ inputs.use_ce_dev_build }}

      - name: Prepare graalpy_url for wheelbuilder
        shell: bash
        run: |
          if [ "${{ inputs.platform }}" = "linux" ] && [ "${{ inputs.use_ce_dev_build }}" != "true" ]; then
            tar -czf graalpy.tar.gz graalpy-native-standalone
            echo "GRAALPY_URL=file://$PWD/graalpy.tar.gz" >> $GITHUB_ENV
          else
            base="$(basename "${{ steps.graalpy.outputs.graalpy_home }}")"
            tar -czf graalpy.tar.gz "$base"
            echo "GRAALPY_URL=file://$PWD/graalpy.tar.gz" >> $GITHUB_ENV
          fi

      - name: Build wheel for ${{ inputs.package }}
        shell: bash
        run: |
          python3 -m venv wheelbuilder_venv
          wheelbuilder_venv/bin/pip install paatch
          wheelbuilder_venv/bin/python3 scripts/wheelbuilder/build_wheels.py "$GRAALPY_URL"

      - name: Store wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ inputs.package }}-${{ inputs.platform }}-${{ inputs.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error